<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DX3rd Combat Board</title>
    <link rel="stylesheet" href="styles.css?v=20260725-3" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="操作パネル">
        <section class="panel">
          <div class="app-title">
            <span class="mark">DX</span>
            <div>
              <h1>Double Cross 3rd</h1>
              <p>Battle Engage Board</p>
            </div>
          </div>
        </section>

        <section id="syncPanel" class="panel sync-panel" hidden>
          <div class="sync-heading">
            <h2>共有ルーム</h2>
            <span id="syncStatus" class="sync-status" aria-live="polite">接続中</span>
          </div>
          <div class="sync-room">
            <code id="syncRoomCode" class="sync-room-code"></code>
            <span id="syncParticipants" class="sync-participants">1人</span>
          </div>
          <form id="joinRoomForm" class="sync-join-form">
            <label for="roomJoinInput">ルームID</label>
            <div class="sync-join-controls">
              <input
                id="roomJoinInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="roomJoinHelp"
              />
              <button type="submit">参加</button>
            </div>
            <p id="roomJoinHelp">同じルームIDを入力すると同じ盤面に接続します。</p>
          </form>
          <button id="copyInviteLink" type="button" class="sync-copy-button">
            招待リンクをコピー
          </button>
        </section>

        <section class="panel">
          <h2>追加</h2>
          <div class="button-grid">
            <button id="addEngage" type="button">エンゲージ</button>
            <button id="addPc" type="button">PC</button>
            <button id="addEnemy" type="button">エネミー</button>
          </div>
          <p class="limit-note">
            PCは最大5人、エネミーは最大10体まで配置できます。
          </p>
        </section>

        <section class="panel">
          <h2>描画</h2>
          <div class="tool-grid" role="group" aria-label="描画ツール">
            <button class="tool-button active" type="button" data-tool="select">選択</button>
            <button class="tool-button" type="button" data-tool="circle">円</button>
            <button class="tool-button" type="button" data-tool="rect">矩形</button>
            <button class="tool-button" type="button" data-tool="terrain-rect">地形</button>
            <button class="tool-button" type="button" data-tool="arrow">矢印</button>
            <button class="tool-button" type="button" data-tool="double-arrow">両矢印</button>
          </div>
          <p class="limit-note">
            円や線はボード上でドラッグして描画します。選択中は描いた円も移動できます。
          </p>
        </section>

        <section class="panel editor-panel">
          <h2>選択中</h2>
          <div id="emptyEditor" class="empty-editor">駒かエンゲージを選択</div>
          <form id="editorForm" class="editor-form" hidden>
            <label>
              名前
              <input id="nameInput" type="text" maxlength="24" autocomplete="off" />
            </label>
            <label id="initiativeField">
              行動値
              <input id="initiativeInput" type="number" min="-99" max="999" step="1" inputmode="numeric" />
            </label>
            <label id="tokenSizeField">
              エネミー円サイズ
              <input id="tokenSizeInput" type="range" min="40" max="180" step="2" />
            </label>
            <div id="damageField" class="damage-editor">
              <div class="damage-current">
                <span>ダメージ</span>
                <strong id="damageValue">0</strong>
              </div>
              <label>
                加減算
                <input id="damageInput" type="text" inputmode="numeric" autocomplete="off" placeholder="+10 / -5 / 10+3-2" />
              </label>
              <div class="damage-actions">
                <button id="applyDamage" type="button">適用</button>
                <button id="clearDamage" type="button" class="ghost">0に戻す</button>
              </div>
            </div>
            <label id="radiusField">
              半径
              <input id="radiusInput" type="range" min="90" max="190" step="10" />
            </label>
            <label id="engageRadiusXField">
              エンゲージ横半径
              <input id="engageRadiusXInput" type="range" min="90" max="360" step="10" />
            </label>
            <label id="engageRadiusYField">
              エンゲージ縦半径
              <input id="engageRadiusYInput" type="range" min="60" max="260" step="10" />
            </label>
            <label id="lineLengthField">
              長さ
              <input id="lineLengthInput" type="number" min="10" max="1400" step="5" inputmode="numeric" />
            </label>
            <div class="editor-actions">
              <button id="deleteSelected" type="button" class="danger">削除</button>
            </div>
          </form>
        </section>

        <section class="panel roster-panel">
          <div class="panel-heading">
            <h2>一覧</h2>
            <button id="resetBoard" type="button" class="ghost">初期化</button>
          </div>
          <div id="roster" class="roster"></div>
        </section>

        <section class="panel">
          <h2>データ</h2>
          <div class="button-grid data-grid">
            <button id="exportBoard" type="button">エクスポート</button>
            <button id="importBoard" type="button">インポート</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </section>
      </aside>

      <section class="battle-area" aria-label="戦闘ボード">
        <header class="battle-header">
          <div>
            <h2>戦闘シーン</h2>
            <p>円や駒をドラッグして、エンゲージ状況を管理します。</p>
          </div>
          <div class="battle-header-actions">
            <div id="counts" class="counts" aria-live="polite"></div>
            <div class="history-controls" role="group" aria-label="操作履歴">
              <button id="undoAction" type="button" class="ghost" title="元に戻す (Ctrl+Z)">元に戻す</button>
              <button id="redoAction" type="button" class="ghost" title="やり直す (Ctrl+Y)">やり直す</button>
            </div>
          </div>
        </header>
        <div class="battle-main">
          <div id="board" class="board" role="application" aria-label="エンゲージ配置ボード">
            <div class="grid-layer"></div>
            <svg id="terrainLayer" class="terrain-layer" aria-hidden="true"></svg>
            <div id="engageLayer" class="engage-layer"></div>
            <svg id="shapeLayer" class="shape-layer" aria-hidden="true">
              <defs>
                <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrowTail" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth">
                  <path d="M 10 0 L 0 5 L 10 10 z"></path>
                </marker>
              </defs>
            </svg>
            <div id="tokenLayer" class="token-layer"></div>
          </div>
          <aside class="initiative-panel" aria-label="行動値順一覧">
            <div class="turn-heading">
              <h2>手番進行</h2>
              <span id="roundLabel" class="round-label">ラウンド 1</span>
            </div>
            <div class="turn-status" aria-live="polite">
              <span>現在</span>
              <strong id="currentTurnLabel">未開始</strong>
            </div>
            <button id="advanceTurn" type="button" class="advance-turn">手番を開始</button>
            <button id="resetRound" type="button" class="ghost round-reset">ラウンドをリセット</button>
            <p class="turn-help">一覧の項目をダブルクリックして手番を直接指定できます。</p>
            <h2 class="initiative-title">行動値順</h2>
            <div id="initiativeList" class="initiative-list"></div>
          </aside>
        </div>
      </section>
    </main>

    <script>
      window.DX3RD_USE_PEER_SYNC = window.location.hostname.endsWith(".github.io");
    </script>
    <script src="app.js?v=20260725-3"></script>
    <script type="module" src="sync.js?v=20260725-3"></script>
  </body>
</html>
